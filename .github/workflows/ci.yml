name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Build with placeholder public values only: the Supabase clients are
      # constructed with non-null assertions, so a build without any values
      # for NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY would
      # crash where a client is constructed. These placeholders are not
      # credentials and no build step contacts Supabase with them; pages
      # that read cookies (and therefore call the server client) are
      # dynamic, so they are not prerendered at build time.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: "false"
